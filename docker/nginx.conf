# nginx del frontend de enSEÑArte (imagen nginxinc/nginx-unprivileged:alpine, sin root).
#
# Es la UNICA entrada de la aplicacion: Tailscale Funnel -> 127.0.0.1:8080 -> aqui.
# - Las paginas, CSS, JS y assets se sirven desde /usr/share/nginx/html.
# - /api/, /admin/, /media/ y /static/ se reenvian al backend (servicio
#   "backend" del docker-compose, puerto 8000). Asi todo queda en el mismo
#   dominio: sin CORS y con HTTPS para la camara.

server {
    # 8080: la imagen corre sin root y no puede abrir el 80 (ver el Dockerfile).
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Las subidas del panel admiten hasta 10 MB (apps/cursos/archivos.py).
    client_max_body_size 12m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # DNS interno de Docker. Con la direccion en una variable, nginx busca la IP
    # del backend en cada peticion: arranca aunque el backend todavia no este
    # listo y no se queda con una IP vieja si el contenedor se recrea.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    location = /admin {
        return 301 /admin/;
    }

    # API, admin de Django, archivos subidos y estaticos del admin -> backend.
    # Las cabeceras de seguridad de estas rutas las pone Django.
    location ~ ^/(api|admin|media|static)/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Funnel termina el HTTPS y el puerto 8080 solo escucha en 127.0.0.1:
        # todo lo que llega aqui vino cifrado. Con esto Django sabe que la
        # conexion es segura (SECURE_PROXY_SSL_HEADER) y no redirige en bucle.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
        # Los reportes PDF/Excel pueden tardar unos segundos.
        proxy_read_timeout 90s;
    }

    # Paginas estaticas del frontend.
    location / {
        try_files $uri $uri/ =404;

        # La CSP completa va en un <meta> de cada pagina (scripts/aplicar_csp.py);
        # frame-ancestors solo funciona como cabecera, por eso va aqui.
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # La camara solo para este sitio (evaluacion con MediaPipe).
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
