<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://cachyos-x8664.tailb93c3e.ts.net http://127.0.0.1:8000 http://localhost:8000; media-src 'self' blob: https://cachyos-x8664.tailb93c3e.ts.net http://127.0.0.1:8000 http://localhost:8000; connect-src 'self' https://cachyos-x8664.tailb93c3e.ts.net http://127.0.0.1:8000 http://localhost:8000 https://cdn.jsdelivr.net https://storage.googleapis.com; worker-src 'self' blob:; form-action 'self' https://formsubmit.co; base-uri 'self'; object-src 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis cursos</title>
    <link rel="stylesheet" href="../css/tokens.css?v=20261116">
    <link rel="stylesheet" href="../css/style.css?v=20261116">
    <link rel="stylesheet" href="../css/extra.css?v=20261117">
    <link rel="stylesheet" href="../css/componentes.css?v=20261116">
</head>
<body class="bodyBase paginaProtegida">
    <div id="layout"></div>

    <main class="bodyCursos">
        <div class="headerCursos">
            <div class="decoracionCursos decoracionCursosCirculo" aria-hidden="true"></div>
            <div class="decoracionCursos decoracionCursosCuadrado" aria-hidden="true"></div>
            <div><p class="eyebrowCursos">APRENDE LSC A TU RITMO</p><h1>Cursos</h1><p class="subtituloCursos">Elige un curso y continúa donde lo dejaste.</p></div>
        </div>

        <div id="mensaje"></div>
        <section class="controlesCursos" aria-label="Buscar y filtrar cursos">
            <label class="buscadorCursos" for="buscarCurso"><svg class="icon icon16" aria-hidden="true"><use href="#i-search"></use></svg><span class="srOnly">Buscar un curso</span><input maxlength="100" id="buscarCurso" type="search" placeholder="Buscar un curso"></label>
            <div class="filtrosCursos" role="group" aria-label="Filtros de cursos">
                <button type="button" class="chipCurso activo" data-filtro="todos">Todos</button>
                <button type="button" class="chipCurso" data-filtro="progreso">En progreso</button>
                <button type="button" class="chipCurso" data-filtro="completados">Completados</button>
                <button type="button" class="chipCurso" data-filtro="nuevos">Nuevos</button>
            </div>
        </section>
        <div class="containerItemsCursos" id="listaCursos" aria-live="polite">
            <p class="cargando">Cargando cursos...</p>
        </div>
    </main>

    <div id="footer"></div>

    <script src="../js/config.js?v=6"></script>
    <script src="../js/api.js?v=5"></script>
    <script src="../js/layout.js?v=11"></script>
    <script src="../js/pages/cursos.js?v=5"></script>
</body>
