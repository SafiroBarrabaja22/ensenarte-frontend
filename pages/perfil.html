<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'wasm-unsafe-eval'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: http://127.0.0.1:8000 http://localhost:8000; media-src 'self' blob: http://127.0.0.1:8000 http://localhost:8000; connect-src 'self' http://127.0.0.1:8000 http://localhost:8000 https://cdn.jsdelivr.net https://storage.googleapis.com; worker-src 'self' blob:; form-action 'self' https://formsubmit.co; base-uri 'self'; object-src 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de usuario</title>
    <link rel="stylesheet" href="../css/tokens.css?v=20261116">
    <link rel="stylesheet" href="../css/style.css?v=20261117b">
    <link rel="stylesheet" href="../css/extra.css?v=20261117b">
    <link rel="stylesheet" href="../css/componentes.css?v=20261124">
</head>
<body class="bodyBase paginaProtegida">
    <div id="layout"></div>

    <main class="bodyPerfil">
        <div class="perfilPage">
            <h1 class="titlePerfil">Perfil de Usuario</h1>
            <section class="perfilCabecera" aria-label="Resumen del perfil">
                <div class="perfilDecoracion perfilDecoracionCuadrado" aria-hidden="true"></div>
            </section>

            <section class="infoUsuarioPerfil">
                <img id="fotoPerfil" src="../assets/imagenes/imgPredeterminadaUsuario.png" alt="Avatar del usuario" class="fotoUsuarioPerfil">
                <div class="identidadUsuarioPerfil">
                    <h2 class="nombreUsuarioPerfil" id="nombreUsuario">Cargando perfil…</h2>
                    <p class="emailUsuarioPerfil" id="correoUsuario"></p>
                    <p class="nivelUsuarioPerfil" id="nivelUsuario">Nivel 1 · Explorador de señas</p>
                </div>
                <a class="buttonSelector botonEditarPerfil" href="editar-perfil.html">Editar perfil</a>
            </section>

            <section class="estadisticasPerfil" aria-label="Estadísticas del usuario">
                <article class="tarjetaEstadistica">
                    <span class="iconoEstadistica iconoCursos" aria-hidden="true"><svg class="icon icon26"><use href="#i-books"></use></svg></span>
                    <div><strong id="cursosCompletados">0</strong><span>Cursos completados</span></div>
                </article>
                <article class="tarjetaEstadistica">
                    <span class="iconoEstadistica iconoInsignias" aria-hidden="true"><svg class="icon icon26"><use href="#i-award"></use></svg></span>
                    <div><strong id="insigniasGanadas">0</strong><span>Insignias ganadas</span></div>
                </article>
                <article class="tarjetaEstadistica">
                    <span class="iconoEstadistica iconoRacha" aria-hidden="true"><svg class="icon icon26"><use href="#i-flame"></use></svg></span>
                    <div><strong id="rachaPractica">0</strong><span>Racha de práctica</span></div>
                </article>
            </section>

            <section class="seccionCursosPerfil">
                <h2>Mis cursos</h2>
                <div id="progresoUsuario"><p class="cargando">Cargando progreso...</p></div>
            </section>
        </div>
    </main>

    <script src="../js/config.js?v=8"></script>
    <script src="../js/api.js?v=7"></script>
    <script src="../js/layout.js?v=13"></script>
    <script src="../js/auth.js?v=3"></script>
    <script src="../js/pages/perfil.js?v=11"></script>
</html>
