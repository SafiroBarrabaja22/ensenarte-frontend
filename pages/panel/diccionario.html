<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel - Diccionario</title>
    <link rel="stylesheet" href="../../css/panel.css?v=4">
    <link rel="stylesheet" href="../../css/extra.css">
</head>
<body class="panelBody paginaProtegida">
    <div id="panelLayout"></div>

    <main class="panelMain">
        <a class="panelBtn panelBtnPequeno" href="index.html">Volver</a>
        <h2 id="tituloCurso">Diccionario</h2>
        <div id="mensaje"></div>

        <section class="panelSeccion">
            <h2>Nueva palabra</h2>
            <div class="panelForm">
                <div>
                    <label for="tituloPalabra">Palabra</label>
                    <input type="text" id="tituloPalabra" placeholder="Agua">
                </div>
                <div>
                    <label for="imagenPalabra">Imagen frontal</label>
                    <div class="campoSeleccionRecurso">
                        <input type="text" id="imagenPalabra" placeholder="agua.png">
                        <button class="panelBtn secundario" type="button" data-selector-recurso="imagenPalabra">Buscar imagen</button>
                    </div>
                </div>
                <div>
                    <label for="gifPalabra">Gif de la seña</label>
                    <div class="campoSeleccionRecurso">
                        <input type="text" id="gifPalabra" placeholder="agua.gif">
                        <button class="panelBtn secundario" type="button" data-selector-recurso="gifPalabra" data-extension="gif">Buscar GIF</button>
                    </div>
                </div>
                <div class="panelAcciones">
                    <button class="panelBtn" id="btnCrearPalabra">Agregar palabra</button>
                </div>
            </div>
        </section>

        <section class="panelSeccion">
            <h2>Palabras registradas</h2>
            <p class="ayudaOrden">Arrastra una fila desde <span aria-hidden="true">&#10303;</span> para cambiar el orden en que se muestran en el diccionario.</p>
            <table class="panelTabla">
                <thead>
                    <tr><th aria-label="Orden"></th><th>Palabra</th><th>Imagen</th><th>Gif</th><th>Acciones</th></tr>
                </thead>
                <tbody id="tablaPalabras">
                    <tr><td colspan="5" class="cargando">Cargando...</td></tr>
                </tbody>
            </table>
        </section>
    </main>

    <script src="../../js/config.js?v=2"></script>
    <script src="../../js/api.js?v=5"></script>
    <script src="../../js/layout.js?v=10"></script>
    <script src="../../js/pages/panel/layout-panel.js?v=12"></script>
    <script src="../../js/pages/panel/selector-recursos.js?v=9"></script>
    <script src="../../js/pages/panel/diccionario.js?v=5"></script>
</body>
</html>
