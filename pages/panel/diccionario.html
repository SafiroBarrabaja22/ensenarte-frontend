<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'wasm-unsafe-eval'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: http://127.0.0.1:8000 http://localhost:8000; media-src 'self' blob: http://127.0.0.1:8000 http://localhost:8000; connect-src 'self' http://127.0.0.1:8000 http://localhost:8000 https://cdn.jsdelivr.net https://storage.googleapis.com; worker-src 'self' blob:; form-action 'self' https://formsubmit.co; base-uri 'self'; object-src 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel - Diccionario</title>
    <link rel="stylesheet" href="../../css/tokens.css?v=20261116">
    <link rel="stylesheet" href="../../css/panel.css?v=20261116">
    <link rel="stylesheet" href="../../css/extra.css?v=20261117b">
    <link rel="stylesheet" href="../../css/componentes.css?v=20261124">
</head>
<body class="panelBody paginaProtegida">
    <div id="panelLayout"></div>

    <main class="panelMain">
        <a class="panelBtn panelBtnPequeno" href="index.html">Volver</a>
        <h2 id="tituloCurso">Diccionario</h2>
        <div id="mensaje"></div>

        <section class="panelSeccion">
            <h2>Nueva palabra</h2>
            <div class="panelForm">
                <div>
                    <label for="tituloPalabra">Palabra</label>
                    <input maxlength="100" type="text" id="tituloPalabra" placeholder="Agua">
                </div>
                <div>
                    <label for="imagenPalabra">Imagen frontal</label>
                    <div class="campoSeleccionRecurso">
                        <input maxlength="200" type="text" id="imagenPalabra" placeholder="agua.png">
                        <button class="panelBtn secundario" type="button" data-selector-recurso="imagenPalabra">Buscar imagen</button>
                    </div>
                </div>
                <div>
                    <label for="gifPalabra">Gif de la seña</label>
                    <div class="campoSeleccionRecurso">
                        <input maxlength="200" type="text" id="gifPalabra" placeholder="agua.gif">
                        <button class="panelBtn secundario" type="button" data-selector-recurso="gifPalabra" data-extension="gif">Buscar GIF</button>
                    </div>
                </div>
                <div class="panelAcciones">
                    <button class="panelBtn" id="btnCrearPalabra">Agregar palabra</button>
                </div>
            </div>
        </section>

        <section class="panelSeccion">
            <h2>Palabras registradas</h2>
            <p class="ayudaOrden">Arrastra una fila desde <span aria-hidden="true">&#10303;</span> para cambiar el orden en que se muestran en el diccionario.</p>
            <table class="panelTabla">
                <thead>
                    <tr><th aria-label="Orden"></th><th>Palabra</th><th>Imagen</th><th>Gif</th><th>Acciones</th></tr>
                </thead>
                <tbody id="tablaPalabras">
                    <tr><td colspan="5" class="cargando">Cargando...</td></tr>
                </tbody>
            </table>
        </section>
    </main>

    <script src="../../js/config.js?v=8"></script>
    <script src="../../js/api.js?v=7"></script>
    <script src="../../js/layout.js?v=13"></script>
    <script src="../../js/pages/panel/layout-panel.js?v=13"></script>
    <script src="../../js/pages/panel/selector-recursos.js?v=13"></script>
    <script src="../../js/pages/panel/diccionario.js?v=8"></script>
</body>
</html>
