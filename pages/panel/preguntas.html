<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel - Preguntas</title>
    <link rel="stylesheet" href="../../css/tokens.css?v=20261116">
    <link rel="stylesheet" href="../../css/panel.css?v=20261116">
    <link rel="stylesheet" href="../../css/extra.css?v=20261116b">
    <link rel="stylesheet" href="../../css/componentes.css?v=20261116">
</head>
<body class="panelBody paginaProtegida">
    <div id="panelLayout"></div>

    <main class="panelMain">
        <a class="panelBtn panelBtnPequeno" href="index.html">Volver</a>
        <h2 id="tituloCurso">Preguntas</h2>
        <div id="mensaje"></div>

        <section class="panelSeccion">
            <h2>Preguntas por evaluación</h2>
            <div class="panelForm configEvaluacion">
                <div>
                    <label for="limitePreguntas">¿Cuántas preguntas salen en cada intento?</label>
                    <input type="number" id="limitePreguntas" min="1" step="1" placeholder="Todas">
                    <small id="ayudaLimitePreguntas">Déjalo vacío para que salgan todas. Las preguntas se eligen al azar en cada intento.</small>
                </div>
                <div class="panelAcciones">
                    <button class="panelBtn" type="button" id="btnGuardarLimite">Guardar</button>
                </div>
            </div>
        </section>

        <section class="panelSeccion">
            <h2>Nueva pregunta</h2>
            <div class="panelForm">
                <div>
                    <label for="textoPregunta">Enunciado</label>
                    <input type="text" id="textoPregunta" placeholder="¿Cuál es la seña para la letra A?">
                </div>
                <div>
                    <label for="videoPregunta">Archivo del gif</label>
                    <div class="campoSeleccionRecurso">
                        <input type="text" id="videoPregunta" placeholder="abecedario/a.gif">
                        <button class="panelBtn secundario" type="button" data-selector-recurso="videoPregunta" data-extension="gif">Buscar GIF</button>
                    </div>
                </div>
                <div class="panelAcciones">
                    <button class="panelBtn" id="btnCrearPregunta">Agregar pregunta</button>
                </div>
            </div>
        </section>

        <section class="panelSeccion">
            <h2>Preguntas del curso</h2>
            <div id="listaPreguntas"><p class="cargando">Cargando...</p></div>
        </section>
    </main>

    <script src="../../js/config.js?v=4"></script>
    <script src="../../js/api.js?v=5"></script>
    <script src="../../js/layout.js?v=10"></script>
    <script src="../../js/pages/panel/layout-panel.js?v=12"></script>
    <script src="../../js/pages/panel/selector-recursos.js?v=9"></script>
    <script src="../../js/pages/panel/preguntas.js?v=6"></script>
</body>
</html>
