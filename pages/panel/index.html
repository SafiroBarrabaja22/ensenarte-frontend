<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel - Cursos</title>
    <link rel="stylesheet" href="../../css/panel.css?v=5">
    <link rel="stylesheet" href="../../css/extra.css">
</head>
<body class="panelBody">
    <div id="panelLayout"></div>

    <main class="panelMain">
        <div id="mensaje"></div>

        <section class="panelSeccion">
            <h2>Resumen</h2>
            <div class="panelCards" id="resumen"></div>
        </section>

        <section class="panelSeccion">
            <h2 id="tituloFormulario">Crear curso</h2>
            <div class="panelForm">
                <div>
                    <label for="titulo">Título</label>
                    <input type="text" id="titulo" placeholder="Abecedario">
                </div>
                <div>
                    <label for="nombre">Slug (identificador en la URL)</label>
                    <input type="text" id="nombre" placeholder="abecedario">
                </div>
                <div>
                    <label for="portada">Archivo de portada</label>
                    <div class="campoSeleccionRecurso">
                        <input type="text" id="portada" placeholder="portadaAbecedario.jpg">
                        <button class="panelBtn secundario" type="button" data-selector-recurso="portada" data-categoria="recurso">Buscar imagen</button>
                    </div>
                </div>
                <div>
                    <label for="iconoCurso">Ícono del curso</label>
                    <div class="campoSeleccionRecurso">
                        <input type="text" id="iconoCurso" placeholder="Opcional · imagen cuadrada">
                        <button class="panelBtn secundario" type="button" data-selector-recurso="iconoCurso" data-categoria="recurso">Buscar imagen</button>
                    </div>                </div>
                <div>
                    <label for="insignia">Insignia del curso</label>
                    <div class="campoSeleccionRecurso">
                        <input type="text" id="insignia" placeholder="Opcional">
                        <button class="panelBtn secundario" type="button" data-selector-recurso="insignia" data-categoria="insignia">Buscar insignia</button>
                    </div>
                </div>
                <div>
                    <label>Insignia Curso 100%</label>
                    <div class="campoSeleccionRecurso">
                        <input type="hidden" id="insignia100">
                        <span id="insignia100Seleccionada">Sin insignia asignada</span>
                        <button class="panelBtn secundario" type="button" data-selector-recurso="insignia100" data-categoria="curso_100" data-valor-recurso="id">Elegir insignia</button>
                        <button class="panelBtn secundario" type="button" id="btnQuitarInsignia100">Quitar</button>
                    </div>
                    <img id="previewInsignia100" class="miniaturaInsignia insigniaMiniatura100" alt="Vista previa de insignia Curso 100%" hidden>
                </div>
                <div>
                    <label for="descripcion">Descripción</label>
                    <textarea id="descripcion" rows="2"></textarea>
                </div>
                <div class="panelAcciones">
                    <button class="panelBtn" id="btnGuardar">Guardar curso</button>
                    <button class="panelBtn secundario" id="btnCancelar" style="display:none;">Cancelar</button>
                </div>
            </div>
        </section>

        <section class="panelSeccion" id="cursos-registrados">
            <h2>Cursos registrados</h2>
            <table class="panelTabla">
                <thead>
                    <tr>
                        <th>Título</th><th>Portada</th><th>Insignia</th><th>Curso 100%</th><th>Slug</th><th>Activo</th><th>Creado por</th><th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaCursos">
                    <tr><td colspan="8" class="cargando">Cargando...</td></tr>
                </tbody>
            </table>
        </section>
    </main>

    <script src="../../js/config.js?v=2"></script>
    <script src="../../js/api.js?v=2"></script>
    <script src="../../js/layout.js?v=8"></script>
    <script src="../../js/pages/panel/layout-panel.js?v=9"></script>
    <script src="../../js/pages/panel/selector-recursos.js?v=9"></script>
    <script src="../../js/pages/panel/dashboard.js?v=9"></script>
</body>
</html>
