<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'wasm-unsafe-eval'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://cachyos-x8664.tailb93c3e.ts.net http://127.0.0.1:8000 http://localhost:8000; media-src 'self' blob: https://cachyos-x8664.tailb93c3e.ts.net http://127.0.0.1:8000 http://localhost:8000; connect-src 'self' https://cachyos-x8664.tailb93c3e.ts.net http://127.0.0.1:8000 http://localhost:8000 https://cdn.jsdelivr.net https://storage.googleapis.com; worker-src 'self' blob:; form-action 'self' https://formsubmit.co; base-uri 'self'; object-src 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel - Cursos</title>
    <link rel="stylesheet" href="../../css/tokens.css?v=20261116">
    <link rel="stylesheet" href="../../css/panel.css?v=20261116">
    <link rel="stylesheet" href="../../css/extra.css?v=20261117b">
    <link rel="stylesheet" href="../../css/componentes.css?v=20261116">
</head>
<body class="panelBody paginaProtegida">
    <div id="panelLayout"></div>

    <main class="panelMain">
        <div id="mensaje"></div>

        <section class="panelSeccion">
            <h2>Resumen</h2>
            <div class="panelCards" id="resumen"></div>
            <div class="panelAcciones reportesPlataforma" id="reportesPlataforma" hidden></div>
        </section>

        <section class="panelSeccion">
            <h2 id="tituloFormulario">Crear curso</h2>
            <div class="panelForm">
                <div>
                    <label for="titulo">Título</label>
                    <input maxlength="100" type="text" id="titulo" placeholder="Abecedario">
                </div>
                <div>
                    <label for="nombre">Slug (identificador en la URL)</label>
                    <input maxlength="50" type="text" id="nombre" placeholder="abecedario">
                </div>
                <div>
                    <label for="portada">Archivo de portada</label>
                    <div class="campoSeleccionRecurso">
                        <input maxlength="255" type="text" id="portada" placeholder="portadaAbecedario.jpg">
                        <button class="panelBtn secundario" type="button" data-selector-recurso="portada" data-categoria="recurso">Buscar imagen</button>
                    </div>
                </div>
                <div>
                    <label for="iconoCurso">Ícono del curso</label>
                    <div class="campoSeleccionRecurso">
                        <input maxlength="255" type="text" id="iconoCurso" placeholder="Opcional · imagen cuadrada">
                        <button class="panelBtn secundario" type="button" data-selector-recurso="iconoCurso" data-categoria="recurso">Buscar imagen</button>
                    </div>                </div>
                <div>
                    <label for="insignia">Insignia del curso</label>
                    <div class="campoSeleccionRecurso">
                        <input maxlength="255" type="text" id="insignia" placeholder="Opcional">
                        <button class="panelBtn secundario" type="button" data-selector-recurso="insignia" data-categoria="insignia">Buscar insignia</button>
                    </div>
                </div>
                <div>
                    <label for="btnElegirInsignia100">Insignia Curso 100%</label>
                    <div class="campoSeleccionRecurso">
                        <input type="hidden" id="insignia100">
                        <span id="insignia100Seleccionada">Sin insignia asignada</span>
                        <button class="panelBtn secundario" type="button" id="btnElegirInsignia100" data-selector-recurso="insignia100" data-categoria="curso_100" data-valor-recurso="id">Elegir insignia</button>
                        <button class="panelBtn secundario" type="button" id="btnQuitarInsignia100">Quitar</button>
                    </div>
                    <img id="previewInsignia100" class="miniaturaInsignia insigniaMiniatura100" alt="Vista previa de insignia Curso 100%" hidden>
                </div>
                <div>
                    <label for="descripcion">Descripción</label>
                    <textarea maxlength="1000" id="descripcion" rows="2"></textarea>
                </div>
                <div class="panelAcciones">
                    <button class="panelBtn" id="btnGuardar">Guardar curso</button>
                    <button class="panelBtn secundario oculto" id="btnCancelar">Cancelar</button>
                </div>
            </div>
        </section>

        <section class="panelSeccion" id="cursos-registrados">
            <h2>Cursos registrados</h2>
            <table class="panelTabla">
                <thead>
                    <tr>
                        <th>Título</th><th>Portada</th><th>Insignia</th><th>Curso 100%</th><th>Slug</th><th>Activo</th><th>Creado por</th><th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaCursos">
                    <tr><td colspan="8" class="cargando">Cargando...</td></tr>
                </tbody>
            </table>
        </section>
    </main>

    <script src="../../js/config.js?v=7"></script>
    <script src="../../js/api.js?v=5"></script>
    <script src="../../js/layout.js?v=11"></script>
    <script src="../../js/pages/panel/layout-panel.js?v=10"></script>
    <script src="../../js/pages/panel/selector-recursos.js?v=12"></script>
    <script src="../../js/pages/panel/dashboard.js?v=11"></script>
</body>
</html>
