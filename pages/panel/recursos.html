<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca visual</title>
    <link rel="stylesheet" href="../../css/panel.css?v=6">
    <link rel="stylesheet" href="../../css/extra.css">
        <script src="../../js/layout.js?v=8"></script>
        <script src="../../js/layout.js?v=8"></script>
        <script src="../../js/layout.js?v=8"></script>
</head>
<body class="panelBody paginaProtegida">
    <header class="panelHeader">
        <h1>Biblioteca visual</h1>
        <nav>
            <a href="../inicio-usuario.html" id="volverSitioRecursos">Volver al sitio</a>
            <a href="#" id="salirRecursos">Cerrar sesión</a>
        </nav>
    </header>

    <main class="panelMain">
        <div id="mensaje" aria-live="polite"></div>

        <section class="panelSeccion">
            <h2>Cargar recurso</h2>
            <form class="panelForm formularioRecurso" id="formRecurso">
                <div>
                    <label for="categoriaRecurso">Usar como</label>
                    <select id="categoriaRecurso" name="categoria">
                        <option value="recurso">Recurso de curso</option>
                        <option value="avatar">Avatar de usuario</option>
                        <option value="insignia">Insignia de curso</option>
                        <option value="curso_100">Insignia 100%</option>
                    </select>
                    <small>Se aplica a todas las imágenes seleccionadas.</small>
                </div>
                <div>
                    <label for="archivoRecurso">Imágenes</label>
                    <div class="zonaCargaRecurso">
                        <input type="file" id="archivoRecurso" name="archivo" multiple accept="image/png,image/gif,image/jpeg,image/webp,image/bmp,image/tiff,image/tif,image/avif,image/heic,image/heif,.jfif,.jpg,.jpeg,.png,.gif,.webp,.bmp,.tif,.tiff,.avif,.heic,.heif">
                        <div class="selectorArchivo">
                            <button class="panelBtn selectorArchivoBtn" type="button" id="btnSeleccionarArchivo">Seleccionar imágenes</button>
                            <span id="nombreArchivoRecurso">Ningún archivo seleccionado</span>
                            <button class="panelBtn secundario" type="button" id="btnLimpiarPreview" hidden>Quitar todas</button>
                        </div>
                        <div class="marcoPrevisualizacion">
                            <div class="listaPrevisualizacion" id="listaPrevisualizacion"></div>
                            <span class="textoPrevisualizacion">La vista previa aparecerá aquí</span>
                        </div>
                    </div>
                    <small>PNG, GIF, JPG o WebP; máximo 10 MB cada una. Puedes elegir varias a la vez y editar el nombre de cada una.</small>
                </div>
                <div class="panelAcciones">
                    <button class="panelBtn" type="submit" id="btnSubirRecurso">Subir imágenes</button>
                </div>
            </form>
        </section>

        <section class="panelSeccion">
            <h2>Recursos disponibles</h2>
            <div class="filtrosRecursos">
                <label for="buscarRecursos">Buscar por nombre</label>
                <input type="search" id="buscarRecursos" placeholder="Ej. saludo hola">
                <label for="filtroExtension">Formato</label>
                <select id="filtroExtension">
                    <option value="">Todos</option>
                    <option value="png">PNG</option>
                    <option value="gif">GIF</option>
                    <option value="jpg">JPG</option>
                    <option value="jpeg">JPEG</option>
                    <option value="webp">WebP</option>
                </select>
                <label for="filtroCategoria">Categoría</label>
                <select id="filtroCategoria">
                    <option value="">Todas</option>
                    <option value="recurso">Recursos</option>
                    <option value="avatar">Avatares</option>
                    <option value="insignia">Insignias</option>
                    <option value="curso_100">Insignia 100%</option>
                </select>
            </div>
            <div class="bibliotecaGrid" id="listaRecursos" aria-live="polite"></div>
            <nav class="paginacionRecursos" id="paginacionRecursos" aria-label="Páginas de la biblioteca" hidden></nav>
        </section>
    </main>

    <script src="../../js/config.js?v=2"></script>
    <script src="../../js/api.js?v=5"></script>
    <script src="../../js/layout.js?v=10"></script>
    <script src="../../js/pages/panel/recursos.js?v=11"></script>
</body>
     <script src="../../js/layout.js?v=10"></script>
