<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'wasm-unsafe-eval'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: http://127.0.0.1:8000 http://localhost:8000; media-src 'self' blob: http://127.0.0.1:8000 http://localhost:8000; connect-src 'self' http://127.0.0.1:8000 http://localhost:8000 https://cdn.jsdelivr.net https://storage.googleapis.com; worker-src 'self' blob:; form-action 'self' https://formsubmit.co; base-uri 'self'; object-src 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña</title>
    <link rel="stylesheet" href="../css/tokens.css?v=20261116">
    <link rel="stylesheet" href="../css/style.css?v=20261117b">
    <link rel="stylesheet" href="../css/extra.css?v=20261117b">
    <link rel="stylesheet" href="../css/componentes.css?v=20261116">
</head>
<body class="bodyLogin">
    <a class="authHomeLink" href="../index.html" aria-label="Volver al inicio"><span>en</span>SEÑArte</a>
    <div class="disLogin">
        <form class="formLogin" id="formSolicitar">
            <p class="loginEyebrow">enSEÑArte · LSC</p>
            <h1 class="titleLogin">Recuperar</h1>
            <div id="mensaje"></div>
            <div class="inpLogin">
                <label class="soloLectores" for="correo">Correo registrado</label>
                <input maxlength="254" type="email" id="correo" class="inputLogin" placeholder="Tu correo registrado" required>
            </div>
            <button type="submit" class="submitLogin">Enviarme el enlace</button>
            <p class="footerLogin">¿Ya tienes cuenta?<a href="login.html" class="linkLogin">Inicia sesión aquí</a></p>
        </form>

        <form class="formLogin oculto" id="formConfirmar">
            <h1 class="titleLogin">Nueva contraseña</h1>
            <div id="mensajeConfirmar"></div>
            <div class="inpLogin">
                <label class="soloLectores" for="passwordNueva">Nueva contraseña</label>
                <input maxlength="128" type="password" id="passwordNueva" class="inputLogin" placeholder="Nueva contraseña" minlength="8" required>
            </div>
            <div class="inpLogin">
                <label class="soloLectores" for="passwordConfirmar">Repite la contraseña</label>
                <input maxlength="128" type="password" id="passwordConfirmar" class="inputLogin" placeholder="Repite la contraseña" minlength="8" required>
            </div>
            <button type="submit" class="submitLogin">Cambiar contraseña</button>
            <p class="footerLogin oculto" id="pedirOtroEnlace">¿El enlace venció?<a href="recuperar.html" class="linkLogin">Pide uno nuevo</a></p>
        </form>

        <div class="bannerLogin">
            <h1 class="saludoslogin">Recupera tu contraseña</h1>
            <p class="infoLogin" id="textoBanner">Te enviaremos a tu correo un enlace de un solo uso para confirmar que fuiste tú y elegir una contraseña nueva.</p>
        </div>
    </div>

    <script src="../js/config.js?v=8"></script>
    <script src="../js/api.js?v=5"></script>
    <script src="../js/layout.js?v=11"></script>
    <script src="../js/auth.js?v=3"></script>
    <script src="../js/pages/recuperar.js?v=3"></script>
</html>
