<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/extra.css">
</head>
<body class="bodyLogin">
    <a class="authHomeLink" href="../index.html" aria-label="Volver al inicio"><span>en</span>SEÑArte</a>
    <div class="disLogin">
        <form class="formLogin" id="formLogin">
            <p class="loginEyebrow">enSEÑArte · LSC</p>
            <h1 class="titleLogin">Iniciar sesión</h1>
            <div id="mensaje"></div>
            <div class="inpLogin">
                <input type="text" id="usuario" class="inputLogin" placeholder="Usuario" required>
            </div>
            <div class="inpLogin">
                <input type="password" id="password" class="inputLogin" placeholder="Contraseña" required>
            </div>
            <button type="submit" class="submitLogin" id="btnEnviar">Iniciar sesión</button>
            <p class="footerLogin">¿No tienes cuenta?<a href="signup.html" class="linkLogin">Regístrate aquí</a></p>
            <p class="footerLogin">¿Olvidaste tu contraseña?<a href="recuperar.html" class="linkLogin">Recupérala aquí</a></p>
        </form>
        <div class="bannerLogin">
            <h1 class="saludoslogin">Qué bueno verte</h1>
            <p class="infoLogin">Continúa tu camino para aprender y comunicarte en Lengua de Señas Colombiana.</p>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/pages/login.js"></script>
</body>
</html>
