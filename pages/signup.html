<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse</title>
    <link rel="stylesheet" href="../css/tokens.css?v=20261116">
    <link rel="stylesheet" href="../css/style.css?v=20261116">
    <link rel="stylesheet" href="../css/extra.css?v=20261116b">

</head>
<body class="bodyLogin">
    <a class="authHomeLink" href="../index.html" aria-label="Volver al inicio"><span>en</span>SEÑArte</a>
    <div class="disLogin">
        <form class="formLogin" id="formRegistro">
            <p class="loginEyebrow">enSEÑArte · LSC</p>
            <h1 class="titleLogin">Registro</h1>
            <div id="mensaje"></div>
            <div class="inpLogin">
                <input maxlength="150" type="text" id="nombre" class="inputLogin" placeholder="Usuario" required>
            </div>
            <div class="inpLogin">
                <input maxlength="254" type="email" id="correo" class="inputLogin" placeholder="Correo" required>
            </div>
            <div class="inpLogin">
                <input maxlength="128" type="password" id="password" class="inputLogin" placeholder="Contraseña (mínimo 8 caracteres)" minlength="8" required>
            </div>
            <!-- Trampa para bots: invisible para las personas (y para lectores de
                 pantalla). Un bot que rellena todos los campos lo llena y el
                 backend rechaza el registro. No lo quites ni lo hagas visible. -->
            <div aria-hidden="true" style="position:absolute; left:-10000px; width:1px; height:1px; overflow:hidden;">
                <label for="sitioWeb">No llenes este campo</label>
                <input type="text" id="sitioWeb" name="sitio_web" tabindex="-1" autocomplete="off">
            </div>
            <button type="submit" class="submitLogin" id="btnEnviar">Registrarse</button>
            <p class="footerLogin">¿Ya tienes cuenta?<a href="login.html" class="linkLogin">Inicia sesión aquí</a></p>
        </form>
        <div class="bannerLogin">
            <h1 class="saludoslogin">Únete a la comunidad</h1>
            <p class="infoLogin">Crea tu cuenta y comienza a aprender Lengua de Señas Colombiana a tu propio ritmo.</p>
        </div>
    </div>

    <script src="../js/config.js?v=6"></script>
    <script src="../js/api.js?v=5"></script>
    <script src="../js/layout.js?v=11"></script>
    <script src="../js/auth.js?v=3"></script>
    <script src="../js/pages/registro.js?v=2"></script>
</html>
