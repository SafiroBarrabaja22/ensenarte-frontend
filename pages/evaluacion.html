<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'wasm-unsafe-eval'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: http://127.0.0.1:8000 http://localhost:8000; media-src 'self' blob: http://127.0.0.1:8000 http://localhost:8000; connect-src 'self' http://127.0.0.1:8000 http://localhost:8000 https://cdn.jsdelivr.net https://storage.googleapis.com; worker-src 'self' blob:; form-action 'self' https://formsubmit.co; base-uri 'self'; object-src 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluación</title>
    <link rel="stylesheet" href="../css/tokens.css?v=20261116">
    <link rel="stylesheet" href="../css/style.css?v=20261117b">
    <link rel="stylesheet" href="../css/extra.css?v=20261117b">
    <link rel="stylesheet" href="../css/componentes.css?v=20261124">
</head>
<body class="bodyEvaluationView paginaProtegida">
    <div id="layout"></div>
    <main class="evaluacionNueva evaluacionHistorialPagina">
        <section class="tarjetaEvaluacionNueva tarjetaPreguntas" aria-labelledby="tituloEvaluacion">
            <div class="decoracionEvaluacion" aria-hidden="true"></div>
            <header class="cabeceraEvaluacionNueva">
                <div class="tituloEvaluacionNueva"><span class="iconoEvaluacionMini" aria-hidden="true"><svg class="icon icon20"><use href="#i-checklist"></use></svg></span><h1 id="tituloEvaluacion">Cargando... · Evaluación</h1></div>
                <button type="button" class="botonSalirEvaluacion" id="btnSalirEvaluacion"><svg class="icon icon16" aria-hidden="true"><use href="#i-arrow-left"></use></svg> Salir</button>
            </header>
            <section id="pantallaInicioPreguntas" class="inicioPreguntas evaluationPreparation" aria-labelledby="tituloInicioPreguntas">
                <div id="historialIntentos"></div>
                <div id="mensajeInicio" class="mensajeEvaluacion" role="alert"></div>
                <div class="accionesInicioPreguntas"><button type="button" class="botonComprobar" id="btnIniciarEvaluacion" data-evaluation-start disabled>Comenzar evaluación</button></div>
            </section>
            <div id="pantallaPreguntas" hidden>
            <div class="progresoEvaluacionNueva"><span id="contador">Pregunta 1 de 1</span><strong id="porcentajeEvaluacion">0%</strong><div class="barraEvaluacionNueva"><span id="barraEvaluacion"></span></div></div>
            <h2 id="textoPregunta">Cargando pregunta...</h2>
            <div class="marcoPregunta" id="contenedorVideo"></div>
            <div class="opcionesEvaluacionNueva" id="contenedorOpciones"></div>
            <div class="barraAccionesEvaluacion">
            <div class="feedbackEvaluacion" id="feedback" role="status" aria-live="polite"></div>
            <div id="mensaje" class="mensajeEvaluacion" role="alert"></div>
            <div class="accionesEvaluacion"><button type="button" class="botonComprobar" id="btnComprobar"><svg class="icon icon16" aria-hidden="true"><use href="#i-check"></use></svg> Comprobar</button></div>
            </div>
            </div>
        </section>
    </main>
    <dialog id="dialogSalir" class="dialogSalir"><h2>¿Salir de la evaluación?</h2><p>Perderás tu avance</p><div><button type="button" class="botonSecundario" id="btnSeguir">Seguir aquí</button><button type="button" class="botonPeligro" id="btnConfirmarSalida">Salir</button></div></dialog>
    <script src="../js/config.js?v=8"></script>
    <script src="../js/api.js?v=7"></script>
    <script src="../js/layout.js?v=13"></script>
    <script src="../js/lib/historial-intentos.js?v=10"></script>
    <script src="../js/lib/servicio-historial-intentos.js?v=2"></script>
    <script src="../js/pages/evaluacion.js?v=16"></script>
</body>
</html>
