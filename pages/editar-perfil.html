<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar perfil</title>
    <link rel="stylesheet" href="../css/tokens.css?v=20261116">
    <link rel="stylesheet" href="../css/style.css?v=20261116">
    <link rel="stylesheet" href="../css/extra.css?v=20261116b">
    <link rel="stylesheet" href="../css/componentes.css?v=20261116">
        <script src="../js/layout.js?v=10"></script>
        <script src="../js/layout.js?v=10"></script>
        <script src="../js/layout.js?v=10"></script>
</head>
<body class="bodyBase paginaProtegida">
    <div id="layout"></div>

    <main class="bodyeditarPerfil">
        <div class="editarPerfilPage">
            <a class="volverPerfil" href="perfil.html">← Volver al perfil</a>

            <section class="editarPerfilHero">
                <div class="editarPerfilBanner" aria-hidden="true">
                    <span class="editarBannerCirculo"></span>
                    <span class="editarBannerCuadrado"></span>
                </div>
                <div class="editarPerfilIdentidad">
                    <button type="button" id="btnAbrirSelectorAvatar" class="avatarSelectorTrigger" aria-label="Cambiar avatar">
                        <img id="avatarActual" src="../assets/imagenes/imgPredeterminadaUsuario.png" alt="Avatar del usuario">
                        <span class="botonCamara" aria-hidden="true"><svg class="icon icon16"><use href="#i-camera"></use></svg></span>
                    </button>
                    <div>
                        <h1>Editar perfil</h1>
                        <p>Cambia tu foto, tus datos y tu contraseña</p>
                    </div>
                </div>
            </section>

            <div id="mensaje" class="editarMensaje" role="status" aria-live="polite"></div>

            <section class="editarSeccion" aria-labelledby="tituloInformacion">
                <div class="editarSeccionTitulo">
                    <span class="editarIconoSeccion editarIconoUsuario" aria-hidden="true"><svg class="icon icon20"><use href="#i-user"></use></svg></span>
                    <h2 id="tituloInformacion">Información personal</h2>
                </div>
                <div class="editarCamposGrid">
                    <div class="editarCampo">
                        <label for="username">Nombre de usuario</label>
                        <div class="campoConIcono"><span aria-hidden="true"><svg class="icon icon16"><use href="#i-at"></use></svg></span><input type="text" id="username" name="username" placeholder="Tu nombre de usuario"></div>
                    </div>
                    <div class="editarCampo">
                        <label for="email">Correo electrónico</label>
                        <div class="campoConIcono"><span aria-hidden="true"><svg class="icon icon16"><use href="#i-mail"></use></svg></span><input type="email" id="email" name="email" placeholder="tu-correo@ejemplo.com"></div>
                    </div>
                </div>
                <div class="editarAcciones">
                    <button type="button" class="botonGuardarPerfil" id="btnGuardarDatos">Guardar cambios</button>
                    <a class="botonCancelarPerfil" href="perfil.html">Cancelar</a>
                </div>
            </section>

            <section class="editarSeccion" aria-labelledby="tituloPassword">
                <div class="editarSeccionTitulo">
                    <span class="editarIconoSeccion editarIconoCandado" aria-hidden="true"><svg class="icon icon20"><use href="#i-lock"></use></svg></span>
                    <h2 id="tituloPassword">Cambiar contraseña</h2>
                </div>
                <div id="mensajePassword" class="editarMensaje" role="status" aria-live="polite"></div>
                <div class="editarCamposGrid editarCamposPassword">
                    <div class="editarCampo editarCampoCompleto">
                        <label for="passwordActual">Contraseña actual</label>
                        <div class="campoConIcono campoPassword"><span aria-hidden="true"><svg class="icon icon16"><use href="#i-key"></use></svg></span><input type="password" id="passwordActual" autocomplete="current-password"><button type="button" class="botonVerPassword" data-password="passwordActual" aria-label="Mostrar contraseña"><svg class="icon icon16"><use href="#i-eye"></use></svg></button></div>
                    </div>
                    <div class="editarCampo">
                        <label for="passwordNueva">Nueva contraseña</label>
                        <div class="campoConIcono campoPassword"><span aria-hidden="true"><svg class="icon icon16"><use href="#i-key"></use></svg></span><input type="password" id="passwordNueva" minlength="8" autocomplete="new-password" placeholder="Mínimo 8 caracteres"><button type="button" class="botonVerPassword" data-password="passwordNueva" aria-label="Mostrar contraseña"><svg class="icon icon16"><use href="#i-eye"></use></svg></button></div>
                        <div class="seguridadPassword" id="seguridadPassword" aria-live="polite"><div class="segmentosPassword"><span></span><span></span><span></span><span></span></div><span id="textoSeguridad">Escribe una contraseña</span></div>
                    </div>
                    <div class="editarCampo">
                        <label for="passwordConfirmar">Confirmar contraseña</label>
                        <div class="campoConIcono campoPassword"><span aria-hidden="true"><svg class="icon icon16"><use href="#i-key"></use></svg></span><input type="password" id="passwordConfirmar" minlength="8" autocomplete="new-password" placeholder="Repite la contraseña"><button type="button" class="botonVerPassword" data-password="passwordConfirmar" aria-label="Mostrar contraseña"><svg class="icon icon16"><use href="#i-eye"></use></svg></button></div>
                        <p class="mensajeCoincidencia" id="mensajeCoincidencia" role="alert"></p>
                    </div>
                </div>
                <button type="button" class="botonCambiarPassword" id="btnCambiarPassword">Cambiar contraseña</button>
            </section>
        </div>
    </main>

    <script src="../js/config.js?v=4"></script>
    <script src="../js/api.js?v=5"></script>
    <script src="../js/layout.js?v=10"></script>
    <script src="../js/auth.js?v=2"></script>
    <script src="../js/pages/editar-perfil.js?v=11"></script>
     <script src="../js/layout.js?v=10"></script>
</html>
